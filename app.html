<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Paperwing</title>
    <link rel="icon" href="/paperwing.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/acro/app.css" />
    <script>
      // Apply a saved light/dark override before first paint
      try {
        var t = localStorage.getItem('paperwing:theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Launch screen: inline so it paints on the very first frame */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f3f3f3;
        transition: opacity 0.22s ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .sp-card {
        position: relative;
        width: min(560px, 86vw);
        aspect-ratio: 14 / 9;
        overflow: hidden;
        border-radius: 10px;
        color: #fff;
        font:
          13px/1.45 'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(70% 90% at 85% 15%, #ff6b5e 0%, transparent 60%),
          radial-gradient(60% 80% at 15% 100%, #5a0a1e 0%, transparent 60%),
          linear-gradient(135deg, #e8283f 0%, #c8102e 55%, #7d0a24 100%);
        box-shadow: 0 24px 60px rgb(0 0 0 / 0.28);
        animation: sp-in 0.28s ease-out;
      }
      .sp-card svg.sp-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .sp-brand {
        position: absolute;
        left: 28px;
        top: 26px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sp-brand img {
        width: 44px;
        height: 44px;
        filter: drop-shadow(0 2px 6px rgb(0 0 0 / 0.25));
      }
      .sp-status {
        position: absolute;
        left: 28px;
        bottom: 54px;
        font-size: 13px;
        opacity: 0.95;
      }
      .sp-credit {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 22px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        opacity: 0.8;
      }
      @keyframes sp-in {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash {
          background: #1a1a1a;
        }
      }
      :root[data-theme='dark'] #splash {
        background: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-card">
        <svg class="sp-art" viewBox="0 0 560 360" preserveAspectRatio="none">
          <path
            d="M-20 300 C 120 250, 260 330, 400 210 S 600 80, 620 60"
            fill="none"
            stroke="rgb(255 255 255 / 0.22)"
            stroke-width="2"
            stroke-dasharray="2 10"
            stroke-linecap="round"
          />
          <path
            d="M-20 340 C 160 300, 300 360, 440 250 S 600 140, 620 120"
            fill="none"
            stroke="rgb(255 255 255 / 0.12)"
            stroke-width="2"
            stroke-dasharray="2 10"
            stroke-linecap="round"
          />
          <g transform="translate(330 40) scale(0.36)" opacity="0.16">
            <polygon points="322,248 452,248 452,806 322,740" fill="#fff" />
            <polygon points="452,248 772,398 452,414" fill="#fff" />
            <polygon points="452,414 772,398 452,586" fill="#fff" />
          </g>
        </svg>
        <div class="sp-brand"><img src="/paperwing.svg" alt="" />Paperwing</div>
        <div class="sp-status">Starting…</div>
        <div class="sp-credit">
          <span>Powered by the BentoPDF engine · Free &amp; open source</span>
          <span id="sp-version"></span>
        </div>
      </div>
    </div>
    <header id="titlebar">
      <button
        type="button"
        class="tb-btn tb-menu"
        id="menu-btn"
        data-icon="menu"
      >
        <span>Menu</span>
      </button>
      <button
        type="button"
        class="tb-btn tb-home"
        id="home-btn"
        data-icon="home"
        title="Home"
        aria-label="Home"
      ></button>
      <div id="tabs" role="tablist"></div>
      <button type="button" class="tb-create" id="create-btn" data-icon="plus">
        <span>Create</span>
      </button>
      <div class="tb-drag"></div>
      <button
        type="button"
        class="tb-btn"
        id="help-btn"
        data-icon="help"
        title="Help"
        aria-label="Help"
      ></button>
      <div id="win-controls"></div>
    </header>

    <main id="views">
      <!-- Home -->
      <section id="view-home" class="view">
        <div class="home-welcome">
          <div class="home-brand">
            <span class="app-logo"></span>
            <span>Welcome to Paperwing.</span>
          </div>
          <label class="home-search" data-icon="search">
            <input
              id="home-search"
              type="search"
              placeholder="Search"
              autocomplete="off"
            />
          </label>
        </div>
        <div class="home-body">
          <nav class="home-nav">
            <button
              type="button"
              class="hn-item is-active"
              data-home-tab="recent"
            >
              Recent
            </button>
            <button type="button" class="hn-item" data-home-tab="starred">
              Starred
            </button>
            <div class="hn-head">Files</div>
            <button type="button" class="hn-item" id="open-computer">
              Your computer
            </button>
          </nav>
          <div class="home-main">
            <div class="home-glow"></div>
            <div class="rec-head">
              <h2>Recommended tools for you</h2>
              <button type="button" class="pill-btn" id="see-all-tools">
                See all tools
              </button>
            </div>
            <div class="rec-row">
              <div class="drop-card" id="home-drop">
                <div class="drop-inner">
                  <div class="drop-title">Open a PDF to get started</div>
                  <div class="drop-sub">Drag and drop a file here, or</div>
                  <button type="button" class="accent-btn" id="home-select">
                    Select a file
                  </button>
                </div>
              </div>
              <div class="rec-tools" id="rec-tools"></div>
            </div>
            <div class="recent-head">
              <h2 id="recent-title">Recent</h2>
              <div class="view-toggle">
                <button
                  type="button"
                  class="vt-btn is-active"
                  data-layout="list"
                  data-icon="list"
                  title="List view"
                  aria-label="List view"
                ></button>
                <button
                  type="button"
                  class="vt-btn"
                  data-layout="grid"
                  data-icon="grid"
                  title="Thumbnail view"
                  aria-label="Thumbnail view"
                ></button>
              </div>
            </div>
            <div id="recent-list" class="recent-list"></div>
          </div>
        </div>
      </section>

      <!-- All tools -->
      <section id="view-alltools" class="view">
        <div class="at-head">
          <h1>All tools</h1>
          <button type="button" class="pill-btn" id="alltools-close">
            Close
          </button>
        </div>
        <div class="at-scroll">
          <label class="at-search" data-icon="search">
            <input
              id="alltools-search"
              type="search"
              placeholder="Find any tool"
              autocomplete="off"
            />
          </label>
          <div id="alltools-groups"></div>
        </div>
      </section>

      <!-- Document -->
      <section id="view-doc" class="view">
        <div id="globalbar">
          <nav class="gb-tabs" id="gb-tabs">
            <button type="button" data-panel="all" class="is-active">
              All tools
            </button>
            <button type="button" data-panel="edit">Edit</button>
            <button type="button" data-panel="convert">Convert</button>
            <button type="button" data-panel="sign">E-Sign</button>
          </nav>
          <div class="gb-actions">
            <button
              type="button"
              class="gb-find"
              id="find-btn"
              data-icon-after="search"
            >
              Find text or tools
            </button>
            <span class="gb-sep"></span>
            <button
              type="button"
              class="tb-btn"
              id="save-btn"
              data-icon="save"
              title="Save (Ctrl+S)"
              aria-label="Save"
            ></button>
            <button
              type="button"
              class="tb-btn"
              id="print-btn"
              data-icon="print"
              title="Print (Ctrl+P)"
              aria-label="Print"
            ></button>
            <button type="button" class="dark-pill" id="download-btn">
              Download
            </button>
          </div>
        </div>
        <div id="doc-body">
          <aside id="left-panel"></aside>
          <div id="doc-stage">
            <div id="viewer-host"></div>
            <div id="quickbar"></div>
            <div id="tool-full"></div>
          </div>
          <aside id="right-rail"></aside>
        </div>
      </section>

      <!-- Tool opened without a document -->
      <section id="view-tool" class="view"></section>
    </main>

    <div id="drop-overlay"><div>Drop files to open them</div></div>
    <div id="popover-layer"></div>
    <div id="toasts"></div>
    <input
      type="file"
      id="open-input"
      accept="application/pdf,.pdf"
      multiple
      hidden
    />

    <script type="module" src="/src/acro/app.ts"></script>
  </body>
</html>
