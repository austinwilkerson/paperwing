<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'"
    />
    <title>Paperwing</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #c8102e;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #fff;
        font:
          13px/1.45 'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(70% 90% at 85% 15%, #ff6b5e 0%, transparent 60%),
          radial-gradient(60% 80% at 15% 100%, #5a0a1e 0%, transparent 60%),
          linear-gradient(135deg, #e8283f 0%, #c8102e 55%, #7d0a24 100%);
      }
      svg.art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .brand {
        position: absolute;
        left: 28px;
        top: 26px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand svg {
        width: 44px;
        height: 44px;
        filter: drop-shadow(0 2px 6px rgb(0 0 0 / 0.25));
      }
      .status {
        position: absolute;
        left: 28px;
        bottom: 54px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .bar {
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.25);
      }
      .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #fff;
        animation: slide 1.1s ease-in-out infinite;
      }
      .credit {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 22px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        opacity: 0.8;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="art"
        viewBox="0 0 560 360"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M-20 300 C 120 250, 260 330, 400 210 S 600 80, 620 60"
          fill="none"
          stroke="rgb(255 255 255 / 0.22)"
          stroke-width="2"
          stroke-dasharray="2 10"
          stroke-linecap="round"
        />
        <path
          d="M-20 340 C 160 300, 300 360, 440 250 S 600 140, 620 120"
          fill="none"
          stroke="rgb(255 255 255 / 0.12)"
          stroke-width="2"
          stroke-dasharray="2 10"
          stroke-linecap="round"
        />
        <g transform="translate(330 40) scale(0.36)" opacity="0.16">
          <polygon points="322,248 452,248 452,806 322,740" fill="#fff" />
          <polygon points="452,248 772,398 452,414" fill="#fff" />
          <polygon points="452,414 772,398 452,586" fill="#fff" />
        </g>
      </svg>
      <div class="brand">
        <svg viewBox="0 0 1024 1024" aria-hidden="true">
          <rect
            x="62"
            y="62"
            width="900"
            height="900"
            rx="210"
            fill="#D7193A"
          />
          <polygon points="322,248 452,248 452,806 322,740" fill="#fff" />
          <polygon points="452,248 772,398 452,414" fill="#FFE1DC" />
          <polygon points="452,414 772,398 452,586" fill="#FF9C8F" />
          <polygon points="322,740 452,806 452,586 322,640" fill="#F3D6D1" />
        </svg>
        Paperwing
      </div>
      <div class="status"><span>Starting…</span><span class="bar"></span></div>
      <div class="credit">
        <span>Built on BentoPDF · Free &amp; open source</span>
        <span id="version"></span>
      </div>
    </div>
    <script>
      const v = new URLSearchParams(location.search).get('v');
      if (v) document.getElementById('version').textContent = 'Version ' + v;
    </script>
  </body>
</html>
