name: ✨ Feature request
description: Suggest an improvement or new feature
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem. If Acrobat does this, tell us how it works there.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How would you like Paperwing to handle it?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mock-ups, examples or links.
